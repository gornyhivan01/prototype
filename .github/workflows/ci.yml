name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Минимально необходимые права: только чтение репозитория.
permissions:
  contents: read

# Отменяем предыдущий запуск при новом push в ту же ветку.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Линтер, форматирование и тесты
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Установить uv
        # Плавающих мажорных тегов выше v7 у этого экшена нет, поэтому
        # используем конкретный тег релиза (v10.3.0), а не @v10.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # Кэшируем скачанные пакеты и интерпретаторы Python между запусками.
          enable-cache: true
          # Версия Python берётся из .python-version, здесь дублируем явно.
          python-version: "3.12"

      - name: Установить зависимости
        # --locked падает, если uv.lock расходится с pyproject.toml:
        # в CI важно, чтобы зафиксированные версии были актуальны.
        run: uv sync --locked

      - name: Линтер (ruff)
        run: uv run ruff check .

      - name: Форматирование (black)
        run: uv run black --check .

      - name: Тесты (pytest)
        run: uv run pytest

  frontend:
    name: Сборка фронтенда (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Установить Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Проверка типов и сборка
        run: npm run build
