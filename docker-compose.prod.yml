name: prototype

# Прод-стек для одной VM: PostgreSQL, Keycloak, приложение и Caddy.
# Наружу открыты только 80/443 (Caddy). Остальные сервисы доступны
# только внутри docker-сети.
#
# Запуск: ./deploy/deploy.sh (он готовит realm и применяет миграции).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # Нужны init-скрипту, который создаёт отдельную БД для Keycloak.
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD в .env}
      KC_HOSTNAME: ${AUTH_URL:?задайте AUTH_URL в .env}
      # Разрешает backchannel (token/JWKS/Admin REST) по внутреннему имени
      # keycloak:8080, пока frontend остаётся на публичном AUTH_URL.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?задайте KEYCLOAK_ADMIN_USER в .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?задайте KEYCLOAK_ADMIN_PASSWORD в .env}
    volumes:
      # Файл генерирует scripts/render-realm-prod.py из keycloak/realm-export.json.
      - ./keycloak/realm-export.prod.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-prototype-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Внутри docker-сети БД называется postgres, а не localhost:5433.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      KEYCLOAK_URL: ${AUTH_URL}
      # Server-to-server вызовы идут внутри docker-сети, а не через публичный IP.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      SSO_REDIRECT_URI: ${APP_URL}/auth/sso/callback
      SSO_POST_LOGOUT_REDIRECT_URI: ${APP_URL}/
      SSO_FRONTEND_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_HOST: ${APP_HOST:?задайте APP_HOST в .env}
      AUTH_HOST: ${AUTH_HOST:?задайте AUTH_HOST в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - keycloak
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
