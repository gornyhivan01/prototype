[project]
name = "fastapi-postgres-alembic"
version = "0.1.0"
description = "Для знакомства с FastAPI, PostgreSQL и Alembic."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.35",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.13.0,<1.15",
    "pydantic>=2.7.0,<2.11",
    "pydantic-settings>=2.3.0,<2.8",
    "email-validator>=2.1.0,<2.3",
    "pyjwt>=2.9.0,<3.0",
    "python-multipart>=0.0.20,<0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<0.28",
    "ruff>=0.6.0,<0.12",
    "black>=24.4.0,<26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # bandit
    "C4",  # flake8-comprehensions
]
ignore = [
    "S101",  # asserts в тестах
    "UP017", # timezone.utc привычнее, чем datetime.UTC
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]
