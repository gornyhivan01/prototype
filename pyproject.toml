[project]
name = "task-management"
version = "0.2.0"
description = "REST API для управления задачами: FastAPI, PostgreSQL, аудит и Argon2id."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.35",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<0.31",
    "alembic>=1.13.0,<1.15",
    "pydantic>=2.7.0,<2.11",
    "pydantic-settings>=2.3.0,<2.8",
    "email-validator>=2.1.0,<2.3",
    "pyjwt>=2.9.0,<3.0",
    "pwdlib[argon2,bcrypt]>=0.3.0,<0.4",
    "python-multipart>=0.0.9,<0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<0.28",
    "testcontainers[postgres]>=4.5.0,<5.0",
    "ruff>=0.6.0,<0.12",
    "black>=24.4.0,<26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# В тестах пароли и токены — это тестовые данные, а не секреты.
"tests/**/*.py" = ["S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py311"]
